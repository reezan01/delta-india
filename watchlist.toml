# Series kept current by `delta update` (run every 15 min by the LaunchAgent).
# A new entry is backfilled on its first run (see DEFAULT_INITIAL_DAYS in update.py,
# or set initial_days on the block); later runs append only new closed bars.

[[series]]
symbols = ["BTCUSD", "ETHUSD"]
resolutions = ["1m", "5m", "15m", "1h", "4h", "1d"]

# Full options chain (every contract, with greeks) saved each run to
# data/options/{UNDERLYING}/{date}/{HHMMSS}.csv.gz — ~40 KB per BTC snapshot.
# Day folders older than retention_days (UTC) are deleted at the end of each run.
[options]
underlyings = ["BTC", "ETH"]
retention_days = 90
