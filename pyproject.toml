[project]
name = "delta-india"
version = "0.1.0"
description = "Read-only Delta Exchange India client: REST, WebSocket feed, and candle fetcher"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
delta = "delta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
